# Spec: specs/001-haystack-postgres-merge-sync/, specs/002-haystack-neo4j/, specs/004-haystack-pgvector/
# OpenSpec: openspec/specs/haystack-devcontainer/spec.md
# Note: FAISS (specs/003) removed from default stack — not wired in compose/postCreate.
# Phase 5 T5/D4: postgres-haystack uses pgvector image + vector extension (platform ready; I0/I1 app cutover later).
volumes:
  haystack-fast-api-data:
  postgres-haystack-data:
  neo4j-haystack-data:

services:
  haystack-fast-api:
    container_name: haystack-fast-api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: heavy_rental
      POSTGRES_HOSTNAME: postgres-haystack
      DATABASE_URL: postgresql://postgres:postgres@postgres-haystack:5432/heavy_rental
      # Phase 5 T5/D4: embedding dim contract for future PgvectorDocumentStore (I0/I1 in app).
      # Must match embedder / vector column dim when INDEXING_DOCUMENT_STORE=pgvector is enabled.
      INDEXING_EMBEDDING_DIM: "768"
      # Neo4j / neo4j-haystack (DocumentStore) — see specs/002-haystack-neo4j/
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: heavyrental
      NEO4J_DATABASE: neo4j
    volumes:
      - haystack-fast-api-data:/workspaces/haystack-fast-api
    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity
    depends_on:
      postgres-haystack:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - heavy-rental-network

  # Writable local Postgres (Haystack R/W) + pgvector platform (T5/D4). Host 5434 avoids REST API 5432/5433.
  # Image: pgvector/pgvector:pg17 (Postgres 17 + pgvector). Sync client stays on postgres:17.
  postgres-haystack:
    container_name: postgres-haystack
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: heavy_rental
    ports:
      - "5434:5432"
    volumes:
      - postgres-haystack-data:/var/lib/postgresql/data
      # Fresh volumes only; healthcheck also CREATE EXTENSION IF NOT EXISTS for upgraded data dirs.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Idempotent ensure vector extension (existing volumes skip initdb) + readiness.
      test:
        [
          "CMD-SHELL",
          "psql -U postgres -d heavy_rental -c 'CREATE EXTENSION IF NOT EXISTS vector' >/dev/null 2>&1 && pg_isready -U postgres -d heavy_rental",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - heavy-rental-network

  # Near-real-time merge-upsert from REST API postgres-primary (see scripts/sync-from-primary.sh).
  # Poll interval default 60s (not CDC). Skip+sleep when primary missing (restart: unless-stopped).
  # Feasibility_Study §11 T1: D1→D2 near-RT domain sync.
  postgres-haystack-sync:
    container_name: postgres-haystack-sync
    image: postgres:17
    depends_on:
      postgres-haystack:
        condition: service_healthy
    environment:
      SOURCE_HOST: postgres-primary
      SOURCE_PORT: "5432"
      SOURCE_USER: postgres
      SOURCE_PASSWORD: postgres
      SOURCE_DB: heavy_rental
      TARGET_HOST: postgres-haystack
      TARGET_PORT: "5432"
      TARGET_USER: postgres
      TARGET_PASSWORD: postgres
      TARGET_DB: heavy_rental
      STAGING_SCHEMA: primary_snapshot
      # Near-RT poll (dev SLA ~60s). Override upward for lighter load (e.g. "300" or "86400").
      # Phase 4 T1: lag/duration logged each cycle (METRICS duration_ms, expected_max_lag_seconds).
      SYNC_INTERVAL_SECONDS: "60"
      # Phase 4 T2 / D0: deterministic fleet tables (see contracts/schema-contract.md). Use "all" for full public merge.
      SYNC_TABLE_ALLOWLIST: "asset,booking,category"
      # Skip cycle + sleep when primary down (pairs with unless-stopped; avoid halt+restart storms).
      HALT_ON_PRIMARY_UNAVAILABLE: "false"
      PRIMARY_CHECK_RETRIES: "5"
      PRIMARY_CHECK_DELAY_SECONDS: "3"
      SCHEMA_EVOLUTION: "true"
      ALLOW_UNIQUE_MERGE_KEY: "true"
      # Sandbox defaults: merge mode keeps local-only cols/rows. Opt-in parity flags off.
      # SYNC_MODE=mirror enables DROP_ORPHAN_COLUMNS, SAFE_TYPE_WIDENINGS, SYNC_INDEXES, SYNC_UNIQUE_INDEXES, SYNC_FOREIGN_KEYS.
      SOURCE_SCHEMAS: public
      SYNC_MODE: merge
      DROP_ORPHAN_COLUMNS: "false"
      SYNC_INDEXES: "false"
      SYNC_UNIQUE_INDEXES: "false"
      SAFE_TYPE_WIDENINGS: "false"
      SYNC_FOREIGN_KEYS: "false"
    volumes:
      - ./scripts/sync-from-primary.sh:/usr/local/bin/sync-from-primary.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/sync-from-primary.sh"]
    restart: unless-stopped
    networks:
      - heavy-rental-network

  # Neo4j for Haystack DocumentStore (neo4j-haystack). Complements Postgres domain DB.
  # Browser: http://localhost:7474  Bolt: bolt://localhost:7687  Auth: neo4j/heavyrental (dev only)
  neo4j:
    container_name: neo4j-haystack
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/heavyrental
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-haystack-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p heavyrental 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 45s
    networks:
      - heavy-rental-network

networks:
  heavy-rental-network:
    external: true
    driver: bridge
